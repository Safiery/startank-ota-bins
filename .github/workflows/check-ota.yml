name: Check StarTank OTA packages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check manifest against both packages
        run: python3 tools/check_ota.py
      - name: Run package regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
